[package]
name = "nailpolish"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.86", features = ["backtrace"] }
assert_cmd = "2.0.16"
assert_fs = "1.1.2"
chrono = "0.4.38"
clap = { version = "4.5.7", features = ["derive"] }
csv = "1.3.0"
env_logger = "0.11.3"
handlebars = "6.2.0"
indexmap = "2.5.0"
lazy_static = "1.4.0"
log = "0.4.22"
needletail = "^0.6.3"
rayon = "1.10.0"
regex = "1.10.6"
spoa = { path = "deps/spoa-rs" }
thiserror = "1.0.64"
predicates = "3.1.2"
indoc = "2.0.5"
rkyv = { version = "0.8.10", features = [
  "alloc",
  "bytecheck",
  "std",
  "indexmap-2",
  "smallvec-1",
  "pointer_width_64",
] }
smallvec = "1.15.0"
memmap = "0.7.0"
itertools = "0.14.0"
git-version = "0.3.9"
serde = { version = "1.0.219", features = ["serde_derive"] }
serde_json = "1.0.140"
humansize = "2.1.3"
libc = "0.2.172"

[[bin]]
name = "nailpolish"

[workspace.metadata.cross.target.x86_64-unknown-linux-gnu]
# use CentOS7-compatible builder (supports libc 2.17)
image = "ghcr.io/olliecheng/images:cross-x86-centos"

[profile.test]
opt-level = 3

# create a separate profile for debug profiling
[profile.profiling]
inherits = "release"
debug = true

[features]
simde = ["spoa/simde"]
nonative = ["spoa/nonative"]
