name: Nightly build

permissions:
  contents: write

on:
  push:
    branches: [ '*' ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: "Run tests/setup.sh"
        run: tests/setup.sh
      
      - name: Test
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: "test"
          target: "x86_64-unknown-linux-gnu"

  build-linux:
    runs-on: ubuntu-latest
    needs: test

    # Pin the baseline to x86-64-v3 (AVX2) - otherwise, march=native results in
    # a GH Actions build having AVX512 instructions which are not supported on some
    # HPC CPUs
    env:
      CFLAGS: "-march=x86-64-v3"
      CXXFLAGS: "-march=x86-64-v3"
      RUSTFLAGS: "-C target-cpu=x86-64-v3"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Add build information to environment
        run: echo "CARGO_BUILD_DESC= [$(git rev-parse --short HEAD)]" >> $GITHUB_ENV

      - name: Build
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: "build"
          target: "x86_64-unknown-linux-gnu"
          args: "--release --features nonative"

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: nailpolish-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/nailpolish

  build-macos:
    runs-on: macos-15
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-

      - name: Add x86_64-apple-darwin target
        run: rustup target add x86_64-apple-darwin

      - name: Add aarch64-apple-darwin target
        run: rustup target add aarch64-apple-darwin

      - name: Add build information to environment
        run: echo "CARGO_BUILD_DESC=built on GitHub Actions from commit $(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build for macOS (x86_64)
        run: cargo build --release --target x86_64-apple-darwin --features nonative

      - name: Build for macOS (arm64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/nailpolish \
            target/aarch64-apple-darwin/release/nailpolish \
            -output nailpolish-macos-universal

      - name: Upload macOS Universal Binary
        uses: actions/upload-artifact@v4
        with:
          name: nailpolish-macos-universal
          path: nailpolish-macos-universal

  release-nightly:
    name: release-nightly
    runs-on: ubuntu-latest
    needs: [ build-linux, build-macos ]
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Record short commit hash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Move the nightly tag to this commit
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly

      - name: Publish nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          commit: ${{ github.sha }}
          name: "Nightly build"
          prerelease: true
          makeLatest: false
          allowUpdates: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "artifacts/nailpolish-linux-x86_64/nailpolish,artifacts/nailpolish-macos-universal/nailpolish-macos-universal"
          body: |
            Automated nightly build, which always points at the most recent `develop` commit. This build is from
            [`${{ env.SHORT_SHA }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
